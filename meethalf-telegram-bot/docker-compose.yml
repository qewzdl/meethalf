services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: "dev"
      BOT_TOKEN: "${BOT_TOKEN}"
      BOT_DEBUG: "false"
      BOT_ALLOWED_UPDATES: "message,callback_query"
      BOT_POLLING_TIMEOUT: "10s"
      BOT_WORKERS: "4"
      BOT_QUEUE_SIZE: "100"
      SESSION_STORE: "redis"
      SESSION_TTL: "24h"
      API_BASE_URL: "http://host.docker.internal:8080"
      API_TIMEOUT: "5s"
      REDIS_ENABLED: "true"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_CONNECT_TIMEOUT: "5s"
      REDIS_READ_TIMEOUT: "3s"
      REDIS_WRITE_TIMEOUT: "3s"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
